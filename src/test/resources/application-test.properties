# Test-specific application properties
# This file is used when running tests with @ActiveProfiles("test")

# H2 Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console - disabled for tests
spring.h2.console.enabled=false

# JPA/Hibernate Configuration for Testing
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Disable SQL logging for cleaner test output
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Test-specific logging
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=WARN

# Disable banner for cleaner test output
spring.main.banner-mode=off
